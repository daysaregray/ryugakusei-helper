<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>유학생 도우미</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: one narrow app column; sticky header with scrollable tabs; Japanese text always set in a rounded face so it reads as "the phrase you show someone". */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#172033; --muted:#5B6578; --line:#DBE0EA;
  --accent:#26448A; --accent-ink:#FFFFFF; --accent-soft:#E2E8F5; --sun:#B97A0C; --sun-soft:#FBF1DC; --danger:#B4372F;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-ja:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F131B; --surface:#171D29; --ink:#E6EAF2; --muted:#9AA3B6; --line:#283043;
  --accent:#93AEEB; --accent-ink:#0F1730; --accent-soft:#1E2942; --sun:#E3B24E; --sun-soft:#2C2416; --danger:#EF8A80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F131B; --surface:#171D29; --ink:#E6EAF2; --muted:#9AA3B6; --line:#283043;
  --accent:#93AEEB; --accent-ink:#0F1730; --accent-soft:#1E2942; --sun:#E3B24E; --sun-soft:#2C2416; --danger:#EF8A80; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.ja{font-family:var(--f-ja);font-weight:500}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:10px;padding-block:14px 6px}
.brand h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
.brand .ja{font-size:13px;color:var(--muted)}
.lang{margin-left:auto;align-self:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;cursor:pointer}
.lang:hover{border-color:var(--accent)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;border:0;background:none;padding:10px 12px 12px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}

main{padding-block:20px 64px}
section.view{display:flex;flex-direction:column;gap:20px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.lede{color:var(--muted);margin:4px 0 0;max-width:62ch}

.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:4px 6px 4px 16px}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;min-width:0;border:0;background:none;padding:8px 0;outline:none;font-size:16px}
.search button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 16px;font-weight:600;cursor:pointer}
.hints{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:620px){.cats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cat{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;cursor:pointer}
.cat:hover{border-color:var(--accent)}
.cat b{font-size:15px}
.cat .ja{font-size:12px;color:var(--muted)}
.cat small{color:var(--muted);font-size:12px;margin-top:4px}

/* garbage day panel */
.today{background:var(--sun-soft);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.today h3{font-size:16px}
.today .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.today .tag{background:var(--surface);border-radius:999px;padding:3px 12px;font-size:14px;font-weight:600;color:var(--sun)}
.today .none{color:var(--muted);font-size:14px}
.linkbtn{border:0;background:none;color:var(--accent);padding:0;cursor:pointer;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.sched{overflow-x:auto}
.sched table{border-collapse:collapse;width:100%;min-width:420px;font-size:14px}
.sched th,.sched td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}
.sched th:first-child,.sched td:first-child{text-align:left;padding-left:0}
.sched input{width:18px;height:18px;accent-color:var(--sun)}

/* info cards */
.list{display:flex;flex-direction:column;gap:10px}
details.info{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.info>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
details.info>summary::-webkit-details-marker{display:none}
.sumtext{flex:1;min-width:0}
.sumtext h3{font-size:16px;font-weight:600}
.sumtext p{margin:2px 0 0;color:var(--muted);font-size:14px}
.catlabel{font-size:12px;color:var(--accent);font-weight:600}
.body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.body ol,.body ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.terms{display:flex;flex-wrap:wrap;gap:6px}
.term{background:var(--accent-soft);border-radius:8px;padding:4px 10px;font-size:13px}
.term .ja{font-size:14px}
.src{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.star{flex:none;border:0;background:none;cursor:pointer;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.star:hover{background:var(--accent-soft)}
.star[aria-pressed="true"]{color:var(--sun)}
.star svg{width:20px;height:20px}

/* phrases */
.phrase{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.phrase .ja.big{font-size:19px;line-height:1.5;font-weight:700}
.phrase .kana{font-family:var(--f-ja);font-size:13px;color:var(--muted)}
.phrase .ko{font-size:14px}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:500;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--danger)}
.actions .star{margin-left:auto}
.showbig{position:fixed;inset:0;z-index:20;background:var(--surface);display:flex;flex-direction:column;justify-content:center;gap:20px;padding:calc(24px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}
.showbig .ja{font-size:clamp(28px,7vw,48px);font-weight:700;line-height:1.45}
.showbig p{color:var(--muted);margin:0}

/* community */
.notice{font-size:13px;color:var(--muted);background:var(--accent-soft);border-radius:10px;padding:10px 14px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;cursor:pointer;text-align:left;width:100%}
.post:hover{border-color:var(--accent)}
.post h3{font-size:16px;font-weight:600}
.post p{margin:2px 0 0;color:var(--muted);font-size:14px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.badge{font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:6px;padding:0 6px}
form.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 12px;font-weight:400;font-size:15px}
label.f textarea{min-height:110px;resize:vertical}
.frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(max-width:480px){.frow{grid-template-columns:1fr}}
.err{color:var(--danger);font-size:13px;margin:0}
.thread{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;display:flex;flex-direction:column;gap:10px}
.thread h2{font-size:20px}
.thread .text{white-space:pre-wrap;overflow-wrap:anywhere}
.comment{border-top:1px solid var(--line);padding-top:10px}
.comment .text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.empty{color:var(--muted);text-align:center;padding:28px 12px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;z-index:30;pointer-events:none}
h2.sec{font-size:17px;font-weight:700}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
@media (prefers-reduced-motion:no-preference){.post,.cat,details.info{transition:border-color .15s}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><h1>유학생 도우미</h1><span class="ja" lang="ja">留学生サポート</span><button class="lang" id="langBtn" type="button">English</button></div>

  </div>
</header>

<main class="wrap" id="main"></main>
<div class="toast" id="toast" hidden></div>

/* ---------- search ---------- */
function match(hay,q){const h=hay.toLowerCase();return q.toLowerCase().split(/\s+/).filter(Boolean).every(t=>h.includes(t))}
function searchAll(q){
  return {
    info: INFO.filter(i=>{const e=INFO_EN[i.id];return match([i.title,i.sum,i.tags,i.steps.join(" "),(i.terms||[]).flat().join(" "),CATS[i.cat].ko,e.title,e.sum,e.steps.join(" "),e.terms.join(" "),(e.bring||[]).join(" "),CATS_EN[i.cat].join(" ")].join(" ").replace(/<[^>]+>/g,""),q)}),
    phrases: PHRASES.filter(p=>match([p.ja,p.kana,p.ko,p.setKo,PHRASE_EN[p.set][0],PHRASE_EN[p.set][1][+p.id.slice(3)]].join(" "),q)),
    posts: S.posts.filter(p=>match([p.title,p.body,p.category].join(" "),q)),
  };
}

}

function infoCard(i,open){

  <div class="body"><ol>${x.steps.map(s=>`<li>${s}</li>`).join("")}</ol>
  ${x.bring?`<div><div class="eyebrow">${t.bring}</div><ul>${x.bring.map(b=>`<li>${esc(b)}</li>`).join("")}</ul></div>`:""}
  <div><div class="eyebrow">${t.jaTerms}</div><div class="terms">${x.terms.map(m=>`<span class="term"><span class="ja" lang="ja">${esc(m[0])}</span> · ${esc(m[1])}</span>`).join("")}</div></div>

function todayPanel(){
  const t=T(),sc=sched(), d=new Date().getDay(), tm=(d+1)%7;

  let edit="";
  if(S.schedEditing){
    edit=`<div class="sched"><table><thead><tr><th>${t.kind}</th>${DAYS.map((_,di)=>`<th>${dayName(di)}</th>`).join("")}</tr></thead><tbody>${GARB.map((g,i)=>`<tr><td>${garbName(i)}</td>${DAYS.map((_,di)=>`<td><input type="checkbox" id="sc-${i}-${di}" data-sc="${i}" data-day="${di}" ${(sc[i]||[]).includes(di)?"checked":""} aria-label="${t.dayOf(garbName(i),dayName(di))}"></td>`).join("")}</tr>`).join("")}</tbody></table></div>
    <div class="actions"><button class="btn primary" data-act="sched-done">${t.done}</button><button class="btn" data-act="sched-reset">${t.reset}</button></div>`;
  }
  return `<div class="today"><div class="sechead"><h3>${t.today(dayName(d))}</h3><button class="linkbtn" data-act="sched-edit">${S.schedEditing?t.close:t.setDays}</button></div>
  <div class="row">${tag(on(d))}</div><div class="row"><span class="none">${t.tomorrow(dayName(tm))}</span>${tag(on(tm))}</div>
  ${S.sched?"":`<span class="none">${t.exampleSched}</span>`}${edit}</div>`;
}

function renderHome(){
  const t=T(),q=S.query.trim();
  let results="";
  if(q){
    const r=searchAll(q);const n=r.info.length+r.phrases.length+r.posts.length;
    results=`<div class="sechead"><h2 class="sec">${esc(t.results(q,n))}</h2><button class="linkbtn" data-act="clear">${t.clear}</button></div>
    ${n?"":`<div class="empty">${t.noRes} <button class="linkbtn" data-act="ask">${t.askC}</button></div>`}
    ${r.info.length?`<div class="list"><div class="eyebrow">${t.lifeInfo}</div>${r.info.map(i=>infoCard(i,r.info.length<=2)).join("")}</div>`:""}
    ${r.phrases.length?`<div class="list"><div class="eyebrow">${t.phrases}</div>${r.phrases.slice(0,8).map(phraseCard).join("")}</div>`:""}
    ${r.posts.length?`<div class="list"><div class="eyebrow">${t.community}</div>${r.posts.slice(0,6).map(postRow).join("")}</div>`:""}`;
  }
  return `<section class="view"><div><h2 style="font-size:24px">${t.homeH}</h2><p class="lede">${t.homeLede}</p></div>
  <form class="search" id="homeSearch" role="search"><input id="q" type="search" placeholder="${esc(t.ph)}" value="${esc(S.query)}" aria-label="${t.search}"><button type="submit">${t.search}</button></form>
  <div class="hints">${t.hints.map(h=>`<button class="chip" data-hint="${esc(h)}">${esc(h)}</button>`).join("")}</div>
  ${results}
  ${q?"":`${todayPanel()}
  <div class="list"><h2 class="sec">${t.catsH}</h2><div class="cats">${Object.entries(CATS).map(([k,c])=>`<button class="cat" data-cat="${k}"><b>${catName(k)}</b><span class="ja" lang="ja">${c.ja}</span><small>${catDesc(k)}</small></button>`).join("")}</div></div>
  <div class="list"><div class="sechead"><h2 class="sec">${t.recent}</h2><button class="linkbtn" data-go="community">${t.seeAll}</button></div>${S.posts.slice(0,3).map(postRow).join("")||`<div class="empty">${t.noPosts}</div>`}</div>`}
  </section>`;
}
function renderInfo(){
  const t=T(),list=INFO.filter(i=>S.infoCat==="all"||i.cat===S.infoCat);
  return `<section class="view"><div><h2 style="font-size:22px">${t.infoH}</h2><p class="lede">${t.infoLede}</p></div>
  <div class="hints"><button class="chip" data-icat="all" aria-pressed="${S.infoCat==="all"}">${t.all}</button>${Object.keys(CATS).map(k=>`<button class="chip" data-icat="${k}" aria-pressed="${S.infoCat===k}">${catName(k)}</button>`).join("")}</div>
  <div class="list">${list.map(i=>infoCard(i,false)).join("")}</div></section>`;
}
function renderPhrases(){
  const t=T(),set=PHRASE_SETS.find(s=>s.id===S.phraseSet);
  return `<section class="view"><div><h2 style="font-size:22px">${t.phH}</h2><p class="lede">${t.phLede}</p></div>
  <div class="hints">${PHRASE_SETS.map(s=>`<button class="chip" data-pset="${s.id}" aria-pressed="${S.phraseSet===s.id}">${setName(s)}</button>`).join("")}</div>
  <div class="list">${PHRASES.filter(p=>p.set===set.id).map(phraseCard).join("")}</div></section>`;
}
function renderCommunity(){
  if(S.openPost) return renderThread();
  const t=T(),q=S.postSearch.trim();
  const list=S.posts.filter(p=>(S.postCat==="전체"||p.category===S.postCat)&&(!q||match(p.title+" "+p.body,q)));
  const mode=S.live?"":`<div class="notice">${t.preview}</div>`;
  const ro=S.live&&!S.canWrite?`<div class="notice">${t.readonly}</div>`:"";
  return `<section class="view"><div class="sechead"><div><h2 style="font-size:22px">${t.comH}</h2><p class="lede">${t.comLede}</p></div>
  ${S.canWrite&&!S.composing?`<button class="btn primary" data-act="compose">${t.ask}</button>`:""}</div>${mode}${ro}
  ${S.composing?composeForm():""}
  <form class="search" id="postSearch" role="search"><input id="pq" type="search" placeholder="${t.postSearch}" value="${esc(S.postSearch)}" aria-label="${t.postSearch}"><button type="submit">${t.search}</button></form>
  <div class="hints">${["전체",...POST_CATS].map(c=>`<button class="chip" data-pcat="${c}" aria-pressed="${S.postCat===c}">${postCat(c)}</button>`).join("")}</div>
  <div class="list">${list.map(postRow).join("")||`<div class="empty">${t.noMatch}</div>`}</div></section>`;
}
function composeForm(){
  const t=T();
  return `<form class="card" id="compose"><div class="frow"><label class="f">${t.nick}<input id="c-nick" maxlength="20" required value="${esc(S.nickname)}" placeholder="${t.nickPh}"></label>
  <label class="f">${t.category}<select id="c-cat">${POST_CATS.map(c=>`<option value="${c}">${postCat(c)}</option>`).join("")}</select></label></div>
  <label class="f">${t.titleL}<input id="c-title" maxlength="80" required placeholder="${t.titlePh}"></label>
  <label class="f">${t.bodyL}<textarea id="c-body" maxlength="2000" required placeholder="${t.bodyPh}"></textarea></label>
  <p class="notice" style="margin:0">${t.pii}</p><p class="err" id="c-err" hidden></p>
  <div class="actions"><button class="btn primary" type="submit">${t.post}</button><button class="btn" type="button" data-act="cancel-compose">${t.cancel}</button></div></form>`;
}
function renderThread(){
  const t=T(),p=S.posts.find(x=>x.id===S.openPost);
  if(!p) return `<section class="view"><button class="linkbtn" data-act="back">${t.back}</button><div class="empty">${t.gone}</div></section>`;
  const cs=S.comments[p.id];
  const mine=S.uid&&p.authorId===S.uid || (!S.live&&p.authorId==="local");
  return `<section class="view"><button class="linkbtn" data-act="back" style="align-self:flex-start">${t.back}</button>
  <article class="thread"><div class="meta" style="margin:0"><span class="badge">${esc(postCat(p.category))}</span>${p.example?`<span class="badge">${t.example}</span>`:""}<span>${esc(p.nickname||t.anon)}</span><span>${fmtDate(p.createdAt)}</span></div>
  <div style="display:flex;gap:8px;align-items:flex-start"><h2 style="flex:1">${esc(p.title)}</h2>${star("post:"+p.id,p.title,p.category)}</div>
  <div class="text">${esc(p.body)}</div>${mine?`<div class="actions"><button class="btn danger" data-act="del-post">${t.delPost}</button></div>`:""}</article>
  <div class="list"><h2 class="sec">${t.answers} ${cs?cs.length:""}</h2>
  ${cs===undefined?`<div class="empty">${t.loading}</div>`:cs.length?`<div class="thread">${cs.map(c=>`<div class="comment"><div class="meta" style="margin:0 0 4px"><b style="color:var(--ink)">${esc(c.nickname||t.anon)}</b><span>${fmtDate(c.createdAt)}</span>${(S.uid&&c.authorId===S.uid)||(!S.live&&c.authorId==="local")?`<button class="linkbtn" style="font-size:12px" data-delc="${esc(c.id)}">${t.del}</button>`:""}</div><div class="text">${esc(c.text)}</div></div>`).join("")}</div>`:`<div class="empty">${t.noAns}</div>`}
  ${S.canWrite?`<form class="card" id="reply"><div class="frow"><label class="f">${t.nick}<input id="r-nick" maxlength="20" required value="${esc(S.nickname)}"></label><span></span></div>
  <label class="f">${t.replyL}<textarea id="r-text" maxlength="2000" required placeholder="${t.replyPh}"></textarea></label><p class="err" id="r-err" hidden></p>
  <div class="actions"><button class="btn primary" type="submit">${t.reply}</button></div></form>`:""}</div></section>`;
}
function renderFavs(){
  const t=T(),items=Object.entries(S.favs).sort((a,b)=>b[1].at-a[1].at);
  const groups=["info","phrase","post"];
  const body=items.length?groups.map((g,gi)=>{
    const list=items.filter(([k])=>k.startsWith(g+":"));if(!list.length)return"";
    return `<div class="list"><div class="eyebrow">${t.favGroups[gi]}</div>${list.map(([k,v])=>{
      const id=k.slice(g.length+1);
      if(g==="info"){const i=INFO.find(x=>x.id===id);return i?infoCard(i,false):""}
      if(g==="phrase"){const p=PHRASES.find(x=>x.id===id);return p?phraseCard(p):""}
      const p=S.posts.find(x=>x.id===id);
      return p?postRow(p):`<div class="phrase"><b>${esc(v.title)}</b><span style="color:var(--muted);font-size:13px">${t.deleted}</span><div class="actions">${star(k,v.title,v.sub)}</div></div>`;
    }).join("")}</div>`}).join("")
    :`<div class="empty">${t.favEmpty}</div>`;
  return `<section class="view"><div><h2 style="font-size:22px">${t.favH}</h2><p class="lede">${S.live&&S.uid&&S.backend!=="firebase"?t.favAcct:t.favLocal}</p></div>${body}</section>`;
}
function render(){
  applyChrome();
  document.querySelectorAll("#tabs button[data-v]").forEach(b=>b.setAttribute("aria-current",b.dataset.v===S.view?"page":"false"));
  const R={home:renderHome,info:renderInfo,phrases:renderPhrases,community:renderCommunity,favorites:renderFavs}[S.view];
  $("#main").innerHTML=R();
}
function go(v){S.view=v;if(v!=="community")closePost();try{history.replaceState(null,"","#"+v)}catch(e){}render();window.scrollTo(0,0)}

/* ---------- favorites ---------- */
function toggleFav(key,title,sub){
  if(S.favs[key]) delete S.favs[key]; else S.favs[key]={title,sub,at:Date.now()};
  toast(S.favs[key]?T().tFavAdd:T().tFavDel);
  saveFavs(); render();
}
function saveFavs(){
  ls.set("yh.favs",S.favs);
  if(favRef){const snap=JSON.parse(JSON.stringify(S.favs));favWriting=favWriting.then(()=>favRef.set({items:snap})).catch(()=>{})}
}

/* ---------- community actions ---------- */
const PII=[/0\d{1,4}[-\s]?\d{1,4}[-\s]?\d{3,4}/,/[\w.+-]+@[\w-]+\.[\w.]+/,/\d{3}-\d{4}/];
function hasPII(t){return PII.some(r=>r.test(t))}
async function submitPost(){
  const nick=$("#c-nick").value.trim(),title=$("#c-title").value.trim(),body=$("#c-body").value.trim(),cat=$("#c-cat").value,err=$("#c-err");
  if(hasPII(title+" "+body)){err.textContent=T().errPII;err.hidden=false;return}
  S.nickname=nick;ls.set("yh.nick",nick);
  const doc={title,body,category:cat,nickname:nick,authorId:S.uid||"local",createdAt:Date.now()};
  if(S.live){
    try{await S.db.collection("posts").add(doc);S.composing=false;toast(T().tPosted);render()}
    catch(e){err.textContent=e&&e.code==="quota_exceeded"?T().errFull:T().errPost;err.hidden=false;if(e&&e.code==="invalid_argument"){S.canWrite=false}}
  }else{S.posts.unshift({...doc,id:"l"+Date.now()});S.composing=false;toast(T().tPosted+T().tPrev);render()}
}
async function submitReply(){
  const nick=$("#r-nick").value.trim(),text=$("#r-text").value.trim(),err=$("#r-err"),pid=S.openPost;
  if(hasPII(text)){err.textContent=T().errPII;err.hidden=false;return}
  S.nickname=nick;ls.set("yh.nick",nick);
  const c={text,nickname:nick,authorId:S.uid||"local",createdAt:Date.now()};
  if(S.live){try{await S.db.collection("posts/"+pid+"/comments").add(c);toast(T().tReplied)}catch(e){err.textContent=T().errReply;err.hidden=false}}
  else{(S.comments[pid]=S.comments[pid]||[]).push({...c,id:"lc"+Date.now()});toast(T().tReplied+T().tPrev);render()}
}
function openPost(id){
  S.openPost=id;S.view="community";
  if(S.live){
    S.comments[id]=undefined;
    if(commentUnsub)commentUnsub();
    commentUnsub=S.db.collection("posts/"+id+"/comments").orderBy("createdAt","asc").limit(300).onSnapshot(
      snap=>{S.comments[id]=snap.docs.map(d=>({id:d.id,...d.data()}));if(S.openPost===id)render()},
      ()=>{S.comments[id]=[];render()});
  }else if(!S.comments[id])S.comments[id]=[];
  render();window.scrollTo(0,0);
}
function closePost(){S.openPost=null;if(commentUnsub){commentUnsub();commentUnsub=null}}

/* ---------- events ---------- */
$("#langBtn").addEventListener("click",()=>{S.lang=EN()?"ko":"en";ls.set("yh.lang",S.lang);S.query="";render()});
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-v]");if(b)go(b.dataset.v)});
document.addEventListener("click",async e=>{
  const t=e.target.closest("button");if(!t)return;
  const d=t.dataset;
  if(d.fav){e.preventDefault();e.stopPropagation();toggleFav(d.fav,d.ftitle,d.fsub);return}
  if(d.copy){try{await navigator.clipboard.writeText(d.copy);toast(T().tCopied)}catch(err){const r=document.createRange();const el=t.closest(".phrase").querySelector(".ja");r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast(T().tSelected)}return}
  if(d.speak){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(d.speak);u.lang="ja-JP";u.rate=.85;speechSynthesis.speak(u)}catch(err){toast(T().tNoVoice)}return}
  if(d.big){const p=PHRASES.find(x=>x.id===d.big);const el=$("#showbig");el.innerHTML=`<div class="ja" lang="ja">${esc(p.ja)}</div><p>${esc(phraseMean(p))}</p><button class="btn" data-act="close-big" style="align-self:flex-start">${T().close}</button>`;el.hidden=false;return}
  if(d.hint){S.query=d.hint;render();return}
  if(d.cat){S.infoCat=d.cat;go("info");return}
  if(d.go){go(d.go);return}
  if(d.icat){S.infoCat=d.icat;render();return}
  if(d.pset){S.phraseSet=d.pset;render();return}
  if(d.pcat){S.postCat=d.pcat;render();return}
  if(d.open){openPost(d.open);return}
  if(d.delc){if(t.dataset.confirm!=="1"){t.dataset.confirm="1";t.textContent=T().sure;return}
    if(S.live){try{await S.db.doc("posts/"+S.openPost+"/comments/"+d.delc).delete()}catch(err){toast(T().tDelFail)}}
    else{S.comments[S.openPost]=S.comments[S.openPost].filter(c=>c.id!==d.delc);render()}return}
  switch(d.act){
    case"clear":S.query="";render();break;
    case"ask":S.composing=true;go("community");break;
    case"compose":S.composing=true;render();break;
    case"cancel-compose":S.composing=false;render();break;
    case"back":closePost();render();break;
    case"close-big":$("#showbig").hidden=true;break;
    case"sched-edit":S.schedEditing=!S.schedEditing;render();break;
    case"sched-done":S.schedEditing=false;render();break;
    case"sched-reset":S.sched=null;try{localStorage.removeItem("yh.sched")}catch(err){}render();break;
    case"del-post":
      if(t.dataset.confirm!=="1"){t.dataset.confirm="1";t.textContent=T().sure2;return}
      if(S.live){try{await S.db.doc("posts/"+S.openPost).delete();closePost();toast(T().tDeleted);render()}catch(err){toast(T().tDelFail)}}
      else{S.posts=S.posts.filter(p=>p.id!==S.openPost);closePost();render()}break;
  }
});
document.addEventListener("change",e=>{
  const c=e.target;if(c.dataset&&c.dataset.sc!==undefined){
    const s=JSON.parse(JSON.stringify(sched())),i=c.dataset.sc,day=+c.dataset.day;
    s[i]=(s[i]||[]).filter(x=>x!==day);if(c.checked)s[i].push(day);
    S.sched=s;ls.set("yh.sched",s);render();
    const again=document.getElementById(c.id);if(again)again.focus();
  }
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="homeSearch"){S.query=$("#q").value;render()}
  else if(e.target.id==="postSearch"){S.postSearch=$("#pq").value;render()}
  else if(e.target.id==="compose")submitPost();
  else if(e.target.id==="reply")submitReply();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#showbig").hidden=true});

/* ---------- boot ---------- */
const h=(location.hash||"").slice(1);if(["home","info","phrases","community","favorites"].includes(h))S.view=h;
render();

async function startLive(db){
  S.db=db;S.live=true;S.posts=[];
  db.collection("posts").orderBy("createdAt","desc").limit(300).onSnapshot(
    snap=>{S.posts=snap.docs.map(d=>({id:d.id,...d.data()}));if(document.activeElement&&/^(c-|r-|q|pq)/.test(document.activeElement.id))return;render()},
    err=>{console.error(err)});
  if(S.uid){
    favRef=db.doc("data/users/"+S.uid+"/favorites");
    try{const snap=await favRef.get();
      if(snap.exists){S.favs={...(snap.data().items||{})};ls.set("yh.favs",S.favs)}
      else if(Object.keys(S.favs).length){saveFavs()}
    }catch(e){console.error(e)}
  }
  render();
}
function loadScript(src){return new Promise((ok,no)=>{const el=document.createElement("script");el.src=src;el.onload=ok;el.onerror=no;document.head.appendChild(el)})}

(async()=>{
  // 1) Firebase
  if(FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.projectId){
    try{
      const v="10.12.2",base="https://www.gstatic.com/firebasejs/"+v+"/";
      await loadScript(base+"firebase-app-compat.js");
      await Promise.all([loadScript(base+"firebase-auth-compat.js"),loadScript(base+"firebase-firestore-compat.js")]);
      firebase.initializeApp(FIREBASE_CONFIG);
      const cred=await firebase.auth().signInAnonymously();
      S.uid=cred.user.uid;S.backend="firebase";
      await startLive(firebase.firestore());
    }catch(e){console.error("Firebase 연결 실패:",e);S.live=false;S.posts=SAMPLE_POSTS.slice();render()}
    return;
  }
  // 2) claude.ai artifact
  if(!window.claude||!window.claude.use)return;
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  if(!db)return;
  if(user){
    try{S.uid=await user.id()}catch(e){}
    try{const w=await user.can("data.write");if(w===false)S.canWrite=false}catch(e){}
  }
  await startLive(db);
})();
